name: Supabase Keep-Alive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC — well within the 7-day inactivity window
    - cron: '0 0 */3 * *'
  workflow_dispatch: {} # lets you trigger it manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/nations?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"